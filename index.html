<html class="font-montserrat cursor-[url(/favicon.svg),auto]" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Hoang Anh Tuan" />
    <meta name="description" content="Hoang Anh Tuan's personal website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iwmywn</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://iwmywn.github.io" />
    <meta property="og:title" content="iwmywn" />
    <meta property="og:description" content="Hoang Anh Tuan's personal website" />
    <meta property="og:image" content="https://iwmywn.github.io/opengraph-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="iwmywn" />
    <meta name="twitter:description" content="Hoang Anh Tuan's personal website" />
    <meta name="twitter:image" content="https://iwmywn.github.io/opengraph-image.png" />

    <link
      rel="preload"
      href="/fonts/Montserrat-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Montserrat-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Montserrat-MediumItalic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Montserrat-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      ;(function () {
        const savedTheme = localStorage.getItem("theme")
        const prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        if (savedTheme === "dark" || (savedTheme === null && prefersDark)) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>

    <style>
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }
    </style>
  </head>

  <body
    class="animate-color-change-light dark:animate-color-change-dark overflow-hidden text-black antialiased dark:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
